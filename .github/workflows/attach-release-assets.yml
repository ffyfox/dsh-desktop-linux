name: attach-release-assets

# 把某次 build-linux 的产物直接传进一个已存在的草稿 Release，不经过维护者的本机。
#
# 为什么不在 tag 触发的构建里自动上传：
#   - 对外动作（建 Release / 上传资产）必须由维护者显式发起，这个 workflow 是 workflow_dispatch；
#   - 草稿由维护者先建，作者仍是维护者本人，不会变成 github-actions[bot]。
#
# 用法（13 站）：
#   gh workflow run attach-release-assets.yml \
#     -f run_id=<build-linux 的 run id> -f tag=<草稿 Release 的 tag>
#
# 校验：run 必须来自 .github/workflows/build.yml 且已完成并成功（completed / success）；
# run 的 head_sha 必须等于 tag ref 指向的提交；Release 必须是 draft；上传后逐个核对
# API 里的 sha256 digest 与本地文件，不一致就红。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build-linux 的 run id（tag 或空跑那次，产物在它的 artifacts 里）'
        required: true
      tag:
        description: '已存在的草稿 Release 的 tag'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 本 job 不 checkout 仓库，gh 找不到仓库上下文；上传/查看 Release 都靠它。
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 校验 run、tag 与草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "非法的 run_id：'$RUN_ID'（必须为纯数字）" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[A-Za-z0-9._+-]+$ || "$TAG" == *..* ]]; then
            echo "非法的 tag：'$TAG'" >&2
            exit 1
          fi

          run_json="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          run_path="$(jq -r '.path // ""' <<<"$run_json")"
          run_status="$(jq -r '.status // ""' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
          run_sha="$(jq -r '.head_sha // ""' <<<"$run_json")"

          if [[ "$run_path" != ".github/workflows/build.yml" ]]; then
            echo "run $RUN_ID 来源不是 .github/workflows/build.yml（实际：$run_path）" >&2
            exit 1
          fi
          if [[ "$run_status" != "completed" || "$run_conclusion" != "success" ]]; then
            echo "run $RUN_ID 未成功完成（status=$run_status, conclusion=$run_conclusion）" >&2
            exit 1
          fi
          if [[ ! "$run_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "run $RUN_ID 的 head_sha 非法：'$run_sha'" >&2
            exit 1
          fi

          # 从 git/ref/tags/<tag> 解析，避免同名分支引起歧义；同时支持轻量 tag 与 annotated tag。
          tag_ref_json="$(gh api "repos/$REPO/git/ref/tags/$TAG")"
          obj_type="$(jq -r '.object.type // ""' <<<"$tag_ref_json")"
          obj_sha="$(jq -r '.object.sha // ""' <<<"$tag_ref_json")"
          hops=0
          while [[ "$obj_type" == "tag" && $hops -lt 5 ]]; do
            tag_obj_json="$(gh api "repos/$REPO/git/tags/$obj_sha")"
            obj_type="$(jq -r '.object.type // ""' <<<"$tag_obj_json")"
            obj_sha="$(jq -r '.object.sha // ""' <<<"$tag_obj_json")"
            hops=$((hops + 1))
          done
          if [[ "$obj_type" != "commit" || ! "$obj_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "tag $TAG 未指向有效的 commit（type=$obj_type, sha=$obj_sha）" >&2
            exit 1
          fi
          tag_sha="$obj_sha"

          if [[ "$run_sha" != "$tag_sha" ]]; then
            echo "run $RUN_ID 的 head_sha（$run_sha）与 tag $TAG 指向的提交（$tag_sha）不一致" >&2
            exit 1
          fi
          # 草稿 Release 还没和 tag 绑定（页面 URL 是 untagged-…），releases/tags/<tag>
          # 对草稿一律 404；gh release view 会连草稿一起找。
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [[ "$draft" != "true" ]]; then
            echo "Release $TAG 不是草稿（draft=$draft）；只允许往草稿上传" >&2
            exit 1
          fi
          echo "校验通过：run=$RUN_ID path=$run_path status=$run_status conclusion=$run_conclusion sha=$run_sha tag=$TAG"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: deepseek-harness-desktop-linux-*
          merge-multiple: true
          path: assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      # Arch 包是独立的 job、独立的 artifact 名（deepseek-harness-desktop-arch 与
      # -arch-aarch64），不在上面那个 pattern 里；arm64-deb-only 同理，它故意不带前缀。
      # 两个架构都解包到同一个 assets/，下面的上传循环就自动带上它们。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: deepseek-harness-desktop-arch*
          merge-multiple: true
          path: assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: 生成 SHA256SUMS、上传并核对 digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(assets/*)
          if (( ${#files[@]} == 0 )); then
            echo "没有下载到任何产物（run $RUN_ID 的 artifacts 为空？）" >&2
            exit 1
          fi
          # 8 件必须齐全（两架构的 AppImage/deb/rpm + Arch 包）；不再在本机全量下载后，
          # 由这里兜底防止漏传某个架构的产物。
          for pattern in \
            '*-x86_64-unsigned.AppImage' '*-amd64-unsigned.deb' '*-x86_64-unsigned.rpm' \
            '*-arm64-unsigned.AppImage' '*-arm64-unsigned.deb' '*-aarch64-unsigned.rpm' \
            '*-x86_64.pkg.tar.zst' '*-aarch64.pkg.tar.zst'; do
            if ! compgen -G "assets/${pattern}" >/dev/null; then
              echo "缺少匹配 ${pattern} 的产物 —— 检查 run $RUN_ID 的 artifacts" >&2
              exit 1
            fi
          done
          if (( ${#files[@]} != 8 )); then
            echo "产物数量为 ${#files[@]}，期望 8 个" >&2
            exit 1
          fi

          # 写到 assets/ 外再汇总上传，避免 * 把正在重定向创建的 SHA256SUMS 自己也算进去。
          (
            cd assets
            LC_ALL=C sha256sum -- * | sort -k2
          ) > SHA256SUMS
          upload_files=("${files[@]}" SHA256SUMS)

          printf '准备上传 %d 个文件（8 个安装包 + SHA256SUMS）\n' "${#upload_files[@]}"
          gh release upload --clobber -- "$TAG" "${upload_files[@]}"

          # 不下载 851MB 也能核对：Release asset 的 digest 字段就是 sha256。
          release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          gh api "repos/$REPO/releases/$release_id/assets" --jq '.[] | [.name,.digest] | @tsv' > uploaded.txt
          status=0
          for f in "${upload_files[@]}"; do
            name="$(basename "$f")"
            local_digest="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
            remote_digest="$(awk -F'\t' -v n="$name" '$1==n {print $2}' uploaded.txt)"
            if [[ "$remote_digest" != "$local_digest" ]]; then
              echo "digest 不一致：$name 本地 $local_digest 远端 ${remote_digest:-缺失}" >&2
              status=1
            else
              echo "ok $name $remote_digest"
            fi
          done
          exit "$status"
