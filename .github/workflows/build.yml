name: build-linux

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '上游 ref（分支或 tag）；留空则用 PKGBUILD 里的 _tag'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # 与上游自己的 CI 对齐（upstream/.github/workflows/ci.yml 的 PRIMARY_NODE_VERSION: '24'）。
  # 仓库 engines 是 ">=24.9.0"（补丁 0001 抬的，旧的 22.19+ 已不支持），
  # 所以 CI 只钉 Node 24，与上游自己 CI 的 PRIMARY_NODE_VERSION 同一条线。
  NODE_VERSION: '24'
  # 上游 CI 设这个，避免构建期跑到的 dsh 运行时往生产遥测端点上报。这是第三方重打包仓库，
  # 更不该往上游的遥测里灌数据。
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    # 两个架构各跑一条完整流水线：arm64 必须原生构建，prepare 阶段会真的执行目标
    # Electron/Node/Python，交叉构建会失败或产出不可用的包。
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    # 整条流水线（build:official / release:pack / prepare:*）才是耗时大头，多打一种格式只多
    # 一次 fpm/AppImage 打包。所以这里一次跑完三种格式，而不是按格式拆成多个 job 各跑一遍
    # 全流水线（那是 3 倍时间）。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # patches/ 里每个 diff 都是相对 PKGBUILD 里 _tag 那个 commit 的，所以默认 ref 必须取
      # _tag，不能取上游默认分支 master——对着 master 打补丁会直接失败。_tag 是唯一的基线
      # 事实来源，这里读它而不是再写死一遍。
      - name: 解析上游 ref
        id: upstream
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          ref="$INPUT_REF"
          if [[ -z "$ref" ]]; then
            ref="$(bash -c 'source ./PKGBUILD; printf %s "${_tag:-}"' 2>/dev/null || true)"
          fi
          if [[ -z "$ref" ]]; then
            echo "无法确定上游 ref：dispatch 输入为空，且 PKGBUILD 里读不到 _tag" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "==> 上游 ref：$ref"

      - name: 拉上游
        run: ./scripts/fetch-upstream.sh "${{ steps.upstream.outputs.ref }}"

      # 本仓库根目录没有 package.json，pnpm/action-setup 没法自己去读 packageManager，
      # 所以从上游检出里取。写死 pnpm 版本正是这次要修的 bug：写死的 9 会在
      # pnpm install --frozen-lockfile 直接撞 ERR_PNPM_LOCKFILE_CONFIG_MISMATCH。
      - name: 解析 pnpm 版本
        id: pnpm
        run: |
          declared="$(node -p 'require("./upstream/package.json").packageManager ?? ""')"
          version="${declared#pnpm@}"
          if [[ -z "$version" || "$declared" == "$version" ]]; then
            echo "upstream/package.json 的 packageManager 不是 pnpm@…：'$declared'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "==> pnpm $version（来自 upstream/package.json 的 packageManager）"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 必须在 pnpm install 之前：补丁改的就是 apps/desktop 里要被安装/构建的东西。
      - name: 打补丁
        run: ./scripts/apply-patches.sh

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        working-directory: upstream

      # fpm 打 rpm 这一步要调 rpmbuild，Ubuntu runner 上不保证有。
      - name: 装 rpmbuild
        run: |
          if ! command -v rpmbuild >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rpm
          fi

      # build.sh / verify.sh 刻意不读 DSH_HOME（DSH 会话会把它指向用户真实的 ~/.dsh），只认这个。
      - name: 隔离 dsh 数据目录
        run: echo "DSH_DESKTOP_LINUX_HOME=$RUNNER_TEMP/dsh-desktop-test" >> "$GITHUB_ENV"

      # --all = AppImage + deb + rpm，build.sh 内部会把 DSH_DESKTOP_TARGET_FORMATS 设成
      # "AppImage,deb,rpm"。deb/rpm 的 maintainer/homepage 只能来自 apps/desktop/.env.linux
      # （上游刻意忽略环境里的 DSH_DESKTOP_LINUX_*，见 desktop-package-environment.mjs 的
      # AMBIENT_RELEASE_SETTING），build.sh 首次运行会从 .env.linux.example 生成，里面带着
      # 本仓库的 maintainer 与上游 homepage。
      - name: 构建（AppImage + deb + rpm）
        run: ./scripts/build.sh --all

      - name: 验证
        run: ./scripts/verify.sh

      # 打包成功只说明格式对，不说明能启动；arm64 最容易出现「箱子里装的是 x64 零件」。
      # 在虚拟显示器上真的启动一次：窗口没出现，或出现启动失败对话框，都判红。
      - name: 装启动冒烟依赖
        run: |
          sudo apt-get update -qq
          # 刻意不装 libxss1：Electron 既不链接也不加载 XScreenSaver，补丁 0003 已把它从 deb/rpm 的
          # depends 里去掉。这里照旧装上就等于替产物掩盖缺依赖，「没有这个库也能起来」也就证不了。
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils xdotool imagemagick squashfs-tools \
            libnotify4 libnss3 libxtst6 libgbm1 libdrm2 xauth
          # Ubuntu 24.04 把这两个包改名成 t64 版本；按顺序试，装上任一个即可。
          for pkg in libgtk-3-0t64 libgtk-3-0; do
            if sudo apt-get install -y --no-install-recommends "$pkg"; then break; fi
          done
          for pkg in libasound2t64 libasound2; do
            if sudo apt-get install -y --no-install-recommends "$pkg"; then break; fi
          done

      - name: 启动冒烟（AppImage）
        env:
          SMOKE_OUT: ${{ runner.temp }}/dsh-smoke
        run: |
          ./scripts/smoke-appimage.sh \
            "upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts" \
            "linux-${{ matrix.arch }}"

      - name: 保留冒烟截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/dsh-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14

      # 产物在 .desktop-build/ 下——这是个隐藏目录，而 upload-artifact 默认跳过隐藏文件，
      # 路径写对了也传不上去，必须显式打开 include-hidden-files。
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-linux-${{ matrix.arch }}
          path: |
            upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.AppImage
            upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.deb
            upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.rpm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      # 只给 arm64 留一份 deb：持有麒麟等 arm64 设备的测试者只需要 deb，没必要为拿一个包
      # 去下 816MB 的三格式整包。名字故意不带 deepseek-harness-desktop-linux- 前缀——
      # 13 站的 attach-release-assets.yml 按该前缀下载产物，撞上会把同一个 deb 重复上传。
      - name: 只上传 arm64 deb（给 arm64 测试者）
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: arm64-deb-only
          path: upstream/apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.deb
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Arch 包（PKGBUILD）单独一个 job：跑在 Arch 容器里，与上面的 electron-builder 流水线无关。
  # PKGBUILD 直接吃上游 release 源码包，不依赖 ./upstream 检出。
  #
  # 两种架构各跑一份，且都必须原生构建（package-target 的宿主守卫要求宿主架构 == 目标架构，
  # 交叉构建会在 prepare 阶段去执行目标平台的 Electron/Node/Python）。官方 archlinux 镜像
  # 只有 amd64，所以 aarch64 那份跑在 arm64 runner 上、用社区维护的 Arch Linux ARM 镜像。
  # x86_64 的 artifact 名保持原样（本机 AGENTS.local 与以往发版都按这个名字取件），
  # 只有 aarch64 那份带 -aarch64 后缀。
  arch:
    name: arch-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
            image: archlinux:latest
            artifact: deepseek-harness-desktop-arch
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
            image: menci/archlinuxarm:base-devel
            artifact: deepseek-harness-desktop-arch-aarch64
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    # 写进包内 metadata 的 Packager。不设就是 makepkg 的默认值 "Unknown Packager"
    # （本机装出来的包实测就是它，issue #13 里这也是要补的一条）。
    env:
      PACKAGER: 'ffyfox <299493445+ffyfox@users.noreply.github.com>'
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      # Arch Linux ARM 的镜像里 pacman 7 的下载沙箱在 GitHub 的容器里起不来：
      # landlock_create_ruleset 被 seccomp 拦掉，`-Syu` 直接报
      # "restricting filesystem access failed … switching to sandbox user 'alpm' failed"。
      # 关掉这两层并取消 DownloadUser 即可；只影响这一次性构建容器。
      # 官方 archlinux 镜像目前没这个毛病，但同样跑一遍没有副作用。
      - name: 关掉 pacman 的下载沙箱
        run: |
          conf=/etc/pacman.conf
          sed -i 's/^DownloadUser/#DownloadUser/; s/^#\?DisableSandboxFilesystem/DisableSandboxFilesystem/; s/^#\?DisableSandboxSyscalls/DisableSandboxSyscalls/' "$conf"
          grep -q '^DisableSandboxFilesystem' "$conf" || sed -i '/^\[options\]/a DisableSandboxFilesystem' "$conf"
          grep -q '^DisableSandboxSyscalls' "$conf" || sed -i '/^\[options\]/a DisableSandboxSyscalls' "$conf"
          grep -nE '^(#?DownloadUser|DisableSandbox)' "$conf"
          # makepkg 的包扩展名钉成 .pkg.tar.zst：Arch Linux ARM 的镜像与官方镜像配置不一致
          # （run 41858509080 的 aarch64 明明出了包，pkgbuild/ 里却找不到 *.pkg.tar.zst），
          # 钉死之后下游的校验、上传、取件都只认这一个扩展名。当前值一并打出来便于排查。
          grep -nE '^(PKGEXT|PKGDEST|SRCDEST)' /etc/makepkg.conf || true
          printf '\nPKGEXT=".pkg.tar.zst"\n' >> /etc/makepkg.conf
          grep -n '^PKGEXT' /etc/makepkg.conf

      # 必须在 checkout 之前：镜像里没有 git，而 actions/checkout 要调它。
      # 一次 -Syu 再装是 Arch 的正确姿势（避免部分升级）。git 依赖 shadow，
      # 所以 useradd 跟着就有；sudo / fakeroot 由 base-devel 带进来。
      # npm 单独列出来：Arch 已经把它从 nodejs 里拆成独立包，而下面那一步要用它装 pnpm 11。
      - name: 装工具链
        run: pacman -Syu --noconfirm --needed base-devel git nodejs npm pnpm python namcap

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # makepkg 拒绝以 root 运行。runuser 不依赖 setuid，比 sudo 更适合容器。
      - name: 建构建用户
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # PKGBUILD 的 pnpm 门会探「入口能不能被 node 执行」：容器里 pacman 装到的 pnpm 是 12.x，
      # 版本自管理会把入口换成 @pnpm/exe（ELF），必然触发回退。所以先把回退位备好 ——
      # 命令与 PKGBUILD 探不过时打印的那条提示一致：npm 装的 11.28.5 与 packageManager 同版本，
      # 不会自管理，入口是 JS。（runuser -u 会把 HOME 设成 /home/builder，与 PKGBUILD 里
      # $HOME/.local/share/dsh-pnpm-11 指同一处。）
      - name: 准备隔离版 pnpm 11（PKGBUILD 的回退位）
        run: |
          command -v npm >/dev/null || {
            echo "容器里没有 npm —— 检查上面「装工具链」的包列表（Arch 把 npm 拆成独立包了）" >&2
            exit 1
          }
          runuser -u builder -- npm i --no-fund --no-audit --loglevel=error \
            --prefix /home/builder/.local/share/dsh-pnpm-11 pnpm@11.28.5
          runuser -u builder -- /home/builder/.local/share/dsh-pnpm-11/node_modules/.bin/pnpm --version

      # depends 里那套运行时库必须在场：上游 prepare-runtime.ts 会**真的执行 Electron** 去读
      # 它自带的 Node 版本（electron -p process.versions.node），缺一个就是动态链接器直接报
      # "error while loading shared libraries"（实测先在 libnspr4.so 上挂）。所以原先靠
      # makepkg --nodeps 跳过依赖检查是错的——那套「为了打个包不必装 gtk3」的假设不成立。
      # 装完 depends 后 --nodeps 也不再需要，依赖检查恢复成真检查：包名写错会被 pacman 拒掉。
      - name: 装 depends（构建期要真的跑 Electron）
        run: |
          mapfile -t deps < <(bash -c 'source ./PKGBUILD; printf "%s\n" "${depends[@]}"')
          printf 'depends: %s\n' "${deps[*]}"
          pacman -S --noconfirm --needed "${deps[@]}"

      - name: namcap PKGBUILD
        run: |
          out="$(namcap PKGBUILD 2>&1 || true)"
          printf '%s\n' "$out"
          if grep -q ' E: ' <<<"$out"; then
            echo "namcap 在 PKGBUILD 上报了 error" >&2
            exit 1
          fi

      - name: 摊平成 PKGBUILD 目录
        run: runuser -u builder -- ./scripts/pkgbuild-dir.sh

      - name: makepkg
        working-directory: pkgbuild
        # runuser 切成 builder 身份后也要拿到 PACKAGER，所以显式再传一次。
        # PKGDEST 钉在当前目录：run 41855701710 的 aarch64 里 makepkg 报了 Finished making，
        # pkgbuild/ 下却没有包文件（官方 archlinux 镜像没这毛病），显式钉住就不用赌镜像配置。
        run: runuser -u builder -- env PACKAGER="$PACKAGER" PKGDEST="$PWD" makepkg -C --nocheck

      # 对外发 Arch 包，就得有人看一眼它长什么样（issue #13）：包名与 PKGBUILD 一致、
      # metadata 的 Packager 不是 "Unknown Packager"、装进 /opt 的关键路径都在。
      # 不做真安装：pacman -U 装进临时 root 要连带解析 gtk3 那套 depends，为一条断言不值当。
      - name: 校验包（元数据 + 关键路径）
        run: |
          set -euo pipefail
          # 正常情况下包就在 pkgbuild/；镜像若把 PKGDEST 指到别处（run 41855701710 的
          # aarch64 出现过），再往 $HOME / /root / /tmp 找一遍并挪回 pkgbuild/，
          # 免得后面上传那步直接扑空。
          mapfile -t found < <(find pkgbuild /home/builder /root /tmp -maxdepth 6 \
                                 -name 'dsh-desktop-linux-*' -print 2>/dev/null)
          if (( ${#found[@]} == 0 )); then
            echo "没找到任何 dsh-desktop-linux-*（查过 pkgbuild/、/home/builder、/root、/tmp）" >&2
            ls -la pkgbuild >&2
            exit 1
          fi
          printf '候选包 %d 个：\n' "${#found[@]}"
          printf '  %s\n' "${found[@]}"
          pkg="${found[0]}"
          if [[ "$pkg" != pkgbuild/* ]]; then
            echo "包落在 $pkg，挪回 pkgbuild/" >&2
            cp -f "$pkg" pkgbuild/
            pkg="pkgbuild/$(basename "$pkg")"
          fi
          # 包名 = <pkgname>-<pkgver>-<pkgrel>-<arch>.pkg.tar.zst；pacman 的架构名与
          # uname -m 在两种目标上同名（x86_64 / aarch64）。
          want="$(bash -c 'source ./PKGBUILD; printf "%s-%s-%s" "$pkgname" "$pkgver" "$pkgrel"')-$(uname -m)"
          if [[ "$(basename "$pkg")" != "$want.pkg.tar.zst" ]]; then
            echo "包名 $(basename "$pkg") 与 PKGBUILD 的 $want 不一致" >&2
            exit 1
          fi
          pacman -Qip "$pkg"
          got="$(pacman -Qip "$pkg" | sed -n 's/^Packager *: //p')"
          if [[ "$got" != "$PACKAGER" ]]; then
            echo "Packager 实际是 [$got]，期望 [$PACKAGER]" >&2
            exit 1
          fi
          listing="$(bsdtar -tf "$pkg")"
          for path in opt/deepseek-harness-desktop/deepseek-harness \
                      usr/bin/deepseek-harness \
                      usr/share/applications/deepseek-harness.desktop; do
            if ! grep -Fqx "$path" <<<"$listing"; then
              echo "包里没有 $path" >&2
              exit 1
            fi
          done
          echo "校验通过：$(basename "$pkg")"

      # 包得体不等于能启动：AppImage/deb/rpm 那条流水线有启动冒烟，Arch 包此前只核对了
      # 元数据与三个路径，从没被真的打开过。原先「不做真安装」的理由（pacman -U 要连带解析
      # gtk3 那套 depends）已经不成立 —— 上面「装 depends」那步为了构建已经把 depends 全套装好，
      # 这里只是本地安装。装完按同样的判据起一次窗口（scripts/smoke-display.sh）。
      - name: 装启动冒烟依赖
        run: pacman -S --noconfirm --needed xorg-server-xvfb xdotool imagemagick xauth

      - name: 安装并启动冒烟
        env:
          SMOKE_OUT: ${{ runner.temp }}/dsh-smoke-arch
        run: |
          set -euo pipefail
          pkg="$(find pkgbuild -maxdepth 1 -name 'dsh-desktop-linux-*.pkg.tar.zst' -print -quit)"
          [[ -n "$pkg" ]] || { echo "pkgbuild/ 里没有包文件" >&2; exit 1; }
          pacman -U --noconfirm "$pkg"
          pacman -Q dsh-desktop-linux
          # 符号链接要解得开：/usr/bin/deepseek-harness -> /opt/deepseek-harness-desktop/...
          test -x /usr/bin/deepseek-harness
          # makepkg 拒绝 root，应用也不该在 root 下跑：换成构建用户，并给它可写的截图目录。
          mkdir -p "$SMOKE_OUT"
          chown builder:builder "$SMOKE_OUT"
          runuser -u builder -- env SMOKE_OUT="$SMOKE_OUT" \
            ./scripts/smoke-display.sh /usr/bin/deepseek-harness "${{ matrix.arch }}"

      - name: 保留冒烟截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/dsh-smoke-arch/*.png
          if-no-files-found: ignore
          retention-days: 14

      # 包级别 namcap 对「自带完整运行时、装进 /opt」的应用必然报 error，多数不是 PKGBUILD
      # 的缺陷，所以不当门禁：
      #   - "ELF files outside of a valid path ('opt/')"：namcap 自己把 opt/ 归到
      #     questionable_dirs（Namcap/rules/elffiles.py），而 Arch 允许自包含应用装 /opt。
      #   - "Insecure RPATH/RUNPATH"：来自上游预编译的 sherpa-onnx / primary-runtime 二进制。
      #   - "Dependency python-X detected and not included (python modules [...])"：包里带着完整的
      #     python/node/pnpm 运行时，namcap 的 python 依赖探测是按「用系统库」的前提写的，
      #     这几条全是假阳性。
      #   - 但 **"detected and not included (libraries [...])" 那类不是假阳性**：它是 ELF 库级别
      #     的真缺口（libxcrypt-compat / libcrypt.so.1 就是这么找出来的），值得人眼扫一眼。
      # 只打印 error tag 和计数：warning 有四千多条（全是上游预编译二进制的 FULL RELRO）。
      - name: namcap 包（仅报告）
        run: |
          namcap pkgbuild/*.pkg.tar.zst > /tmp/namcap-package.txt 2>&1 || true
          echo "namcap 包级别：$(grep -c ' E: ' /tmp/namcap-package.txt || true) 条 error tag，$(grep -c ' W: ' /tmp/namcap-package.txt || true) 条 warning tag"
          grep ' E: ' /tmp/namcap-package.txt | cut -c1-160 || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            pkgbuild/*.pkg.tar.zst
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
